<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STAT Ver.15</title>

    <!-- PWA・ホーム画面アイコン設定 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- PDF化用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
    <!-- 試合タイマー -->
    <div class="timer-section">
        <div id="timer-display">00:00</div>
        <div class="timer-controls">
            <button id="btn-timer-start" class="timer-btn start">▶ スタート</button>
            <button id="btn-timer-stop" class="timer-btn stop">⏸ 停止</button>
            <button id="btn-timer-reset" class="timer-btn reset">リセット</button>
        </div>
    </div>

    <!-- チーム & 前後半 切り替え -->
    <div class="header">
        <div class="toggle-group">
            <button id="btn-team-own" class="toggle-btn team-btn active">自チーム</button>
            <button id="btn-team-opp" class="toggle-btn team-btn">相手チーム</button>
        </div>
        <div class="toggle-group">
            <button id="btn-first-half" class="toggle-btn phase-btn active">前半</button>
            <button id="btn-second-half" class="toggle-btn phase-btn">後半</button>
        </div>
    </div>

    <!-- 現在のGK設定 -->
    <div class="gk-section">
        出場中の自チームGK: <input type="tel" id="active-gk-num" placeholder="番号">
    </div>

    <!-- 背番号入力 -->
    <div class="number-section">
        <div class="selected-number">背番号: <span id="display-number">未選択</span></div>
        <div class="numpad">
            <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button><button class="num-btn">4</button><button class="num-btn">5</button>
            <button class="num-btn">6</button><button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button><button class="num-btn">0</button>
            <button class="num-btn clear-btn">C (消去)</button>
        </div>
    </div>

    <!-- 横向きHTML/CSSコート図 -->
    <div id="court-area">
        <div class="c-9m left"></div><div class="c-6m left"></div><div class="c-7m left"></div><div class="c-4m left"></div><div class="c-goal left"></div>
        <div class="c-line-center"></div>
        <div class="c-9m right"></div><div class="c-6m right"></div><div class="c-7m right"></div><div class="c-4m right"></div><div class="c-goal right"></div>
        <div id="tap-marker">★</div>
    </div>

    <!-- プレー記録ボタン -->
    <div class="actions">
        <div class="action-group">
            <button class="action-btn goal" data-action="得点">得点</button>
            <button class="action-btn save" data-action="GKセーブ">GKセーブ</button>
            <button class="action-btn miss" data-action="枠外ミス">枠外/ミス</button>
            <button class="action-btn seven" data-action="7mスロー">7mスロー</button>
        </div>
        <div class="action-group">
            <button class="action-btn assist" data-action="アシスト">アシスト</button>
            <button class="action-btn turnover" data-action="ターンオーバー">ﾀｰﾝｵｰﾊﾞｰ</button>
            <button class="action-btn steal" data-action="パスカット">ﾊﾟｽｶｯﾄ</button>
        </div>
        <div class="action-group">
            <button class="action-btn warning" data-action="警告(W)">警告(W)</button>
            <button class="action-btn penalty" data-action="2分退場">2分退場(S)</button>
            <button class="action-btn disqual" data-action="失格(D)">失格(D)</button>
        </div>
    </div>

    <!-- 履歴と取り消し -->
    <div class="history-section">
        <h3 style="margin-top:0;">直近の記録 <button id="btn-undo">↩️ 1つ戻る</button></h3>
        <ul id="history-list">
            <li style="color:#999;">まだ記録がありません</li>
        </ul>
    </div>

    <!-- 各種出力・設定ボタン -->
    <button id="btn-export">📥 公式記録用 CSVデータを出力</button>
    <button id="btn-roster-settings" class="action-btn utility-btn roster-btn">⚙️ 自チームの選手名簿を登録・編集</button>
    <button id="btn-preview-pdf" class="action-btn utility-btn pdf-btn">📄 ランニングスコア＆個人成績をPDF出力</button>
    <div style="height: 50px;"></div>

    <!-- ========================================== -->
    <!-- PDF出力用モーダル（A4フルサイズ固定枠） -->
    <!-- ========================================== -->
    <div id="pdf-modal">
        <div class="pdf-modal-header">
            <button id="btn-close-pdf">戻る</button>
            <button id="btn-download-pdf">↓ PDFを保存・共有</button>
        </div>
        <div id="pdf-scroll-wrapper">
            <div id="score-sheet-container">

                <!-- 1ページ目：公式ランニングスコア -->
                <div class="pdf-page">
                    <h2 class="pdf-title">公式ランニングスコア</h2>
                    <div class="pdf-columns">
                        <div class="pdf-col">
                            <div class="pdf-sub-title">【 前 半 】</div>
                            <table class="pdf-table pdf-running-table">
                                <thead>
                                    <tr style="height: 22px;">
                                        <th colspan="3">自チーム</th>
                                        <th rowspan="2" style="width: 72px;">時間</th>
                                        <th colspan="3">相手チーム</th>
                                    </tr>
                                    <tr style="height: 20px;">
                                        <th style="width: 48px;">番</th><th style="width: 44px;">結</th><th style="width: 60px;">点</th>
                                        <th style="width: 60px;">点</th><th style="width: 44px;">結</th><th style="width: 49px;">番</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-first-half"></tbody>
                            </table>
                        </div>
                        <div class="pdf-col">
                            <div class="pdf-sub-title">【 後 半 】</div>
                            <table class="pdf-table pdf-running-table">
                                <thead>
                                    <tr style="height: 22px;">
                                        <th colspan="3">自チーム</th>
                                        <th rowspan="2" style="width: 72px;">時間</th>
                                        <th colspan="3">相手チーム</th>
                                    </tr>
                                    <tr style="height: 20px;">
                                        <th style="width: 48px;">番</th><th style="width: 44px;">結</th><th style="width: 60px;">点</th>
                                        <th style="width: 60px;">点</th><th style="width: 44px;">結</th><th style="width: 49px;">番</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-second-half"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 強制改ページ -->
                <div class="html2pdf__page-break"></div>

                <!-- 2ページ目：個人スコア（スタッツ） -->
                <div class="pdf-page">
                    <h2 class="pdf-title">個人スコア（スタッツ）</h2>
                    <div class="pdf-columns">
                        <div class="pdf-col">
                            <div class="pdf-sub-title">【 自チーム 】</div>
                            <table class="pdf-table pdf-individual-table">
                                <thead>
                                    <tr style="height: 32px;">
                                        <th style="width: 44px;">番</th>
                                        <th style="width: 165px;">氏名</th>
                                        <th style="width: 54px;">得点</th>
                                        <th style="width: 38px;">W</th>
                                        <th style="width: 38px;">S</th>
                                        <th style="width: 38px;">D</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-individual-own"></tbody>
                            </table>
                        </div>
                        <div class="pdf-col">
                            <div class="pdf-sub-title">【 相手チーム 】</div>
                            <table class="pdf-table pdf-individual-table">
                                <thead>
                                    <tr style="height: 32px;">
                                        <th style="width: 44px;">番</th>
                                        <th style="width: 165px;">氏名</th>
                                        <th style="width: 54px;">得点</th>
                                        <th style="width: 38px;">W</th>
                                        <th style="width: 38px;">S</th>
                                        <th style="width: 38px;">D</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-individual-opp"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 名簿設定モーダル -->
    <div id="roster-modal" class="modal" style="z-index: 10001;">
        <div class="modal-content" style="text-align: left;">
            <h3 style="margin-top: 0; text-align: center;">選手名簿の設定</h3>
            <p style="font-size: 13px; color: #555;">背番号と名前をカンマ(,)で区切って1行ずつ入力してください。<br>登録した全員が個人スコアに最初から表示されます。</p>
            <textarea id="roster-input" style="width: 100%; height: 220px; font-size: 16px; padding: 10px; box-sizing: border-box; margin-bottom: 10px;"></textarea>
            <div style="display: flex; justify-content: space-between;">
                <button id="btn-close-roster" style="padding: 10px 20px; background: #95a5a6; border: none; border-radius: 5px; color: white;">キャンセル</button>
                <button id="btn-save-roster" style="padding: 10px 20px; background: #27ae60; border: none; border-radius: 5px; color: white; font-weight: bold;">保存する</button>
            </div>
        </div>
    </div>

    <!-- シュート詳細モーダル -->
    <div id="shot-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">シュート詳細を記録</h3>
            <div class="shot-type-group">
                <button class="shot-type-btn active" data-type="6m">6m</button>
                <button class="shot-type-btn" data-type="9m">9m</button>
                <button class="shot-type-btn" data-type="サイド">サイド</button>
                <button class="shot-type-btn" data-type="速攻">速攻</button>
            </div>
            <div class="goal-frame">
                <div class="goal-zone" data-zone="左上">左上</div>
                <div class="goal-zone" data-zone="中央上">中上</div>
                <div class="goal-zone" data-zone="右上">右上</div>
                <div class="goal-zone" data-zone="左中">左中</div>
                <div class="goal-zone" data-zone="中央">中央</div>
                <div class="goal-zone" data-zone="右中">右中</div>
                <div class="goal-zone" data-zone="左下">左下</div>
                <div class="goal-zone" data-zone="中央下">中下</div>
                <div class="goal-zone" data-zone="右下">右下</div>
            </div>
            <button id="btn-cancel-shot" class="cancel-btn">キャンセル</button>
        </div>
    </div>

    <!-- 最新のJavaScriptを読み込む -->
    <script src="app.js?v=15"></script>
</body>
</html>
