<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.T.A.T 入力用 Ver.9</title>
    <!-- ↓ PDF化用ライブラリ（完璧な位置です！） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css?v=11">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- 試合タイマー -->
    <div class="timer-section">
        <div id="timer-display">00:00</div>
        <div class="timer-controls">
            <button id="btn-timer-start" class="timer-btn start">▶ スタート</button>
            <button id="btn-timer-stop" class="timer-btn stop">⏸ 停止</button>
            <button id="btn-timer-reset" class="timer-btn reset">リセット</button>
        </div>
    </div>

    <!-- チーム & 前後半 切り替え -->
    <div class="header">
        <div class="toggle-group">
            <button id="btn-team-own" class="toggle-btn team-btn active">自チーム</button>
            <button id="btn-team-opp" class="toggle-btn team-btn">相手チーム</button>
        </div>
        <div class="toggle-group">
            <button id="btn-first-half" class="toggle-btn phase-btn active">前半</button>
            <button id="btn-second-half" class="toggle-btn phase-btn">後半</button>
        </div>
    </div>

    <!-- ★修正：現在のGK設定（はみ出していたものを正しい位置に移動しました） -->
    <div style="text-align: center; margin: 10px 0; font-weight: bold; background: #ecf0f1; padding: 10px; border-radius: 5px;">
        出場中の自チームGK: <input type="tel" id="active-gk-num" placeholder="番号" style="width: 60px; text-align: center; font-size: 18px; padding: 5px;">
    </div>

    <!-- 背番号入力 -->
    <div class="number-section">
        <div class="selected-number">背番号: <span id="display-number">未選択</span></div>
        <div class="numpad">
            <button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button><button class="num-btn">4</button><button class="num-btn">5</button>
            <button class="num-btn">6</button><button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button><button class="num-btn">0</button>
            <button class="num-btn clear-btn">C (消去)</button>
        </div>
    </div>

    <!-- コート図 -->
    <div id="court-area">
        <img src="court.png" alt="コート" id="court-img">
        <div id="tap-marker" style="display:none;">★</div>
    </div>

    <!-- プレー記録ボタン -->
    <div class="actions">
        <div class="action-group">
            <button class="action-btn goal" data-action="得点">得点</button>
            <button class="action-btn save" data-action="GKセーブ">GKセーブ</button>
            <button class="action-btn miss" data-action="枠外ミス">枠外/ミス</button>
            <button class="action-btn seven" data-action="7mスロー">7mスロー</button>
        </div>
        <div class="action-group">
            <button class="action-btn assist" data-action="アシスト">アシスト</button>
            <button class="action-btn turnover" data-action="ターンオーバー">ﾀｰﾝｵｰﾊﾞｰ</button>
            <button class="action-btn steal" data-action="パスカット">ﾊﾟｽｶｯﾄ</button>
        </div>
        <!-- 罰則系の独立グループ -->
        <div class="action-group">
            <button class="action-btn warning" data-action="警告(W)">警告(W)</button>
            <button class="action-btn penalty" data-action="2分退場">2分退場(S)</button>
            <button class="action-btn disqual" data-action="失格(D)">失格(D)</button>
        </div>
    </div>

    <!-- 履歴と取り消し -->
    <div class="history-section">
        <h3 style="margin-top:0;">直近の記録 <button id="btn-undo">↩️ 1つ戻る</button></h3>
        <ul id="history-list">
            <li style="color:#999;">まだ記録がありません</li>
        </ul>
    </div>

    <!-- 既存のCSVボタン -->
    <button id="btn-export" style="margin-bottom: 10px;">📥 公式記録用 CSVデータを出力</button>

    <!-- ★★★ ここからが今回追加したPDF関連のコードです ★★★ -->
    <button id="btn-preview-pdf" class="action-btn" style="background-color: #8e44ad; color: white; width: 100%; margin-top: 10px;">📄 ランニングスコアをPDF出力</button>
    <div style="height: 50px;"></div> <!-- 一番下の余白 -->

    <!-- PDF化されるモーダル（普段は非表示） -->
    <div id="pdf-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; overflow-y:auto; padding:10px; box-sizing:border-box;">
        
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; position:sticky; top:0; z-index:10000;">
            <button id="btn-close-pdf" style="padding:10px 20px; font-size:16px; border-radius:5px; border:none; background:#ecf0f1;">戻る</button>
            <button id="btn-download-pdf" style="padding:10px 20px; font-size:16px; border-radius:5px; border:none; background:#2980b9; color:white; font-weight:bold;">↓ PDFを保存・共有</button>
        </div>

        <div style="overflow-x: auto; background: #525659; padding: 10px; border-radius: 5px;">
            <!-- このA4サイズの白い領域がそのままPDFになります -->
            <div id="score-sheet-container" style="width: 210mm; min-height: 297mm; background: white; padding: 15mm; box-sizing: border-box; font-family: sans-serif; font-size: 14px; margin: 0 auto; color: black;">
                <h2 style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 5px;">公式ランニングスコア</h2>
                <div style="display: flex; justify-content: space-between;">
                    <!-- 左半分：前半 -->
                    <div style="width: 48%;">
                        <h3 style="text-align: center; margin: 5px 0;">【 前 半 】</h3>
                        <table style="width: 100%; border-collapse: collapse; text-align: center;" border="1" bordercolor="#333">
                            <thead style="background: #f0f0f0;">
                                <tr>
                                    <th colspan="3" style="padding: 5px;">自チーム</th>
                                    <th rowspan="2" style="width: 50px;">時間</th>
                                    <th colspan="3" style="padding: 5px;">相手チーム</th>
                                </tr>
                                <tr>
                                    <th style="width:15%;">番</th><th style="width:15%;">結</th><th style="width:20%;">点</th>
                                    <th style="width:20%;">点</th><th style="width:15%;">結</th><th style="width:15%;">番</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-first-half">
                                <!-- JSで自動挿入されます -->
                            </tbody>
                        </table>
                    </div>
                    <!-- 右半分：後半 -->
                    <div style="width: 48%;">
                        <h3 style="text-align: center; margin: 5px 0;">【 後 半 】</h3>
                        <table style="width: 100%; border-collapse: collapse; text-align: center;" border="1" bordercolor="#333">
                            <thead style="background: #f0f0f0;">
                                <tr>
                                    <th colspan="3" style="padding: 5px;">自チーム</th>
                                    <th rowspan="2" style="width: 50px;">時間</th>
                                    <th colspan="3" style="padding: 5px;">相手チーム</th>
                                </tr>
                                <tr>
                                    <th style="width:15%;">番</th><th style="width:15%;">結</th><th style="width:20%;">点</th>
                                    <th style="width:20%;">点</th><th style="width:15%;">結</th><th style="width:15%;">番</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-second-half">
                                <!-- JSで自動挿入されます -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ★★★ 追加ここまで ★★★ -->

    <!-- シュート詳細モーダル (GKチャート & シュート種類) -->
    <div id="shot-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">シュート詳細を記録</h3>
            
            <div class="shot-type-group">
                <button class="shot-type-btn active" data-type="6m">6m</button>
                <button class="shot-type-btn" data-type="9m">9m</button>
                <button class="shot-type-btn" data-type="サイド">サイド</button>
                <button class="shot-type-btn" data-type="速攻">速攻</button>
            </div>

            <div class="goal-frame">
                <div class="goal-zone" data-zone="左上">左上</div>
                <div class="goal-zone" data-zone="中央上">中上</div>
                <div class="goal-zone" data-zone="右上">右上</div>
                <div class="goal-zone" data-zone="左中">左中</div>
                <div class="goal-zone" data-zone="中央">中央</div>
                <div class="goal-zone" data-zone="右中">右中</div>
                <div class="goal-zone" data-zone="左下">左下</div>
                <div class="goal-zone" data-zone="中央下">中下</div>
                <div class="goal-zone" data-zone="右下">右下</div>
            </div>
            
            <button id="btn-cancel-shot" class="cancel-btn">キャンセル</button>
        </div>
    </div>

    <!-- キャッシュバスティング用に?v=9を付与 -->
    <script src="app.js?v=11"></script>
</body>
</html>
